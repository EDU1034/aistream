name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Publish APK to apk branch
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $APK"
          cp "$APK" /tmp/AI-Stream-TV.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk-publish
          git reset --hard >/dev/null 2>&1 || true
          cp /tmp/AI-Stream-TV.apk AI-Stream-TV.apk
          git add -f AI-Stream-TV.apk
          git commit -m "AI Stream TV APK ${GITHUB_SHA}"
          git branch -M apk
          git push -f origin apk
      - uses: actions/upload-artifact@v4
        with:
          name: ai-stream-tv-debug
          path: app/build/outputs/apk/debug/*.apk
